<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EnglishBridge Login</title>

  <!-- SAME FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="platform.css">
</head>
<body>

<div class="platform-shell">

  <!-- HEADER -->
  <header class="platform-header">
    <div style="display: flex; align-items: center; gap: 16px;">
      <div class="platform-brand" style="margin: 0;">
        <div class="platform-brand-mark" style="overflow:hidden;background:transparent;border:none;box-shadow:none;padding:2px;">
          <img src="EnglishBridgeLogo.png" alt="EnglishBridge logo" style="width:100%;height:100%;object-fit:contain;">
        </div>
        <div class="platform-brand-copy">
          <strong>EnglishBridge</strong>
          <span>Student Access Portal</span>
        </div>
      </div>
      <!-- Divider -->
      </div>
  </header>

  <!-- LOGIN PANEL -->
  <main class="platform-main" style="grid-template-columns:1fr; min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;">
    <section class="workspace-panel login-container" style="max-width: 440px; width: 100%; padding: 42px 36px; border-radius: 32px; background: linear-gradient(145deg, rgba(255,255,255,0.96), rgba(245,248,255,0.9)); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.95); box-shadow: 0 16px 48px -8px rgba(60, 36, 18, 0.1), 0 4px 12px -2px rgba(60, 36, 18, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.95);">

      <div style="text-align: center; margin-bottom: 24px;">
        <div style="width: 58px; height: 58px; border-radius: 20px; background: linear-gradient(135deg, rgba(188, 93, 45, 0.12), rgba(96, 114, 61, 0.14)); border: 1px solid rgba(188, 93, 45, 0.22); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; box-shadow: 0 6px 18px rgba(188, 93, 45, 0.12);">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent-deep);">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </div>
        <span class="pill" style="margin-bottom: 10px;">🎓 Student Learning Studio</span>
        <h2 style="font-family: var(--font-family); font-size: 2.1rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 6px;">Welcome Back</h2>
        <p class="sidebar-copy" style="margin: 0; font-size: 0.95rem;">Enter your student details to continue your practice.</p>
        <button type="button" onclick="fillDemoStudent()" style="background: rgba(188,93,45,0.06); border: 1px dashed rgba(188,93,45,0.3); color: var(--accent-deep); padding: 6px 14px; border-radius: 999px; font-size: 0.8rem; font-weight: 700; cursor: pointer; margin-top: 12px; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s;" onmouseover="this.style.background='rgba(188,93,45,0.12)'" onmouseout="this.style.background='rgba(188,93,45,0.06)'">
          ✨ Fill Demo: Ananya Rao (Bangalore High)
        </button>
      </div>

      <div style="display: grid; gap: 14px; margin-bottom: 6px;">
        <div>
          <label style="display: block; font-size: 0.78rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-deep); margin-bottom: 6px;">Your Name</label>
          <input id="name" placeholder="e.g. Ananya Rao" autocomplete="name" style="width: 100%; min-height: 48px; border-radius: 14px; padding: 0 16px;">
        </div>
        <div>
          <label style="display: block; font-size: 0.78rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-deep); margin-bottom: 6px;">Your School</label>
          <input id="school" placeholder="e.g. Govt High School, Bangalore" autocomplete="organization" style="width: 100%; min-height: 48px; border-radius: 14px; padding: 0 16px;">
        </div>
      </div>

      <div id="errorMsg" style="display:none;margin:12px 0;padding:12px 16px;border-radius:14px;background:rgba(220,38,38,0.08);border:1px solid rgba(220,38,38,0.25);color:#b91c1c;font-size:0.88rem;font-weight:600;text-align:center;">
        Please enter both your name and school.
      </div>

      <button class="primary-action" style="margin-top:16px; width: 100%; min-height: 48px; font-size: 1rem;" onclick="login()">Enter Platform →</button>
      <button class="secondary-action" style="margin-top:10px; width: 100%; min-height: 44px; font-size: 0.92rem;" onclick="goAdmin()">Admin Login</button>

    </section>
    <button onclick="window.location.href='index.html'" style="display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);text-decoration:none;font-size:0.88rem;font-family:var(--font-family);font-weight:600;cursor:pointer;background:none;border:none;padding:0;transition:color 0.2s;" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--muted)'">← Back to Welcome</button>
  </main>
  


</div>

<script src="Api.js"></script>
<script>
async function login() {
  const name   = document.getElementById("name").value.trim();
  const school = document.getElementById("school").value.trim();
  const errEl  = document.getElementById("errorMsg");

  if (!name || !school) {
    errEl.textContent = "Please enter both your name and school.";
    errEl.style.display = "block";
    return;
  }
  errEl.style.display = "none";

  const btn = document.querySelector(".primary-action");
  if (btn) { btn.textContent = "Signing in…"; btn.disabled = true; }

  try {
    await Students.login(name, school);
    window.location.href = "platform.html";
  } catch (err) {
    errEl.textContent = "Could not connect to server. Make sure the backend is running.";
    errEl.style.display = "block";
    if (btn) { btn.textContent = "Enter Platform"; btn.disabled = false; }
  }
}
function fillDemoStudent() {
  document.getElementById("name").value = "Ananya Rao";
  document.getElementById("school").value = "Bangalore High School";
}
function goAdmin() { window.location.href = "admin-login.html"; }
document.addEventListener("keydown", e => { if (e.key === "Enter") login(); });
</script>
</body>
</html>
