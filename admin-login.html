<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | EnglishBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..800;1,6..72,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="platform.css">
  <style>
    .auth-shell {
      width: min(calc(100% - 32px), 460px);
      margin: 0 auto;
      padding: 40px 0 60px;
      display: grid;
      gap: 20px;
    }

    .auth-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 4px;
    }

    .auth-card {
      padding: 38px 34px;
      border-radius: var(--radius-xl);
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .auth-card::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent) 0%, var(--olive) 100%);
    }

    .mode-tab {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      padding: 4px;
      border-radius: var(--radius-md);
      background: rgba(148, 163, 184, 0.1);
    }

    .mode-tab-btn {
      flex: 1;
      min-height: 38px;
      border-radius: var(--radius-sm);
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-tab-btn.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow-soft);
    }

    .auth-header h2 {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 4px;
      color: var(--text);
    }

    .auth-subtitle {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.55;
      margin-bottom: 18px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .demo-pill-btn {
      margin: 14px 0 6px;
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      border: 1px dashed rgba(188, 93, 45, 0.4);
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      width: 100%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .demo-pill-btn:hover {
      background: rgba(188, 93, 45, 0.15);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .error-msg {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: var(--sass-soft);
      border: 1px solid rgba(185, 28, 28, 0.3);
      color: var(--sass);
      font-size: 0.88rem;
      font-weight: 600;
      display: none;
    }

    .error-msg.show {
      display: block;
    }

    .success-msg {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: var(--emerald-soft);
      border: 1px solid rgba(84, 104, 56, 0.3);
      color: var(--emerald-deep);
      font-size: 0.88rem;
      font-weight: 600;
      display: none;
    }

    .success-msg.show {
      display: block;
    }

    .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      transition: color 0.2s ease;
    }

    .back-btn:hover {
      color: var(--text);
    }
  </style>
</head>
<body>

<div class="auth-shell">

  <div class="auth-brand">
    <div class="platform-brand-mark">
      <img src="EnglishBridgeLogo.png" alt="EnglishBridge logo" style="height:32px;width:auto;object-fit:contain;">
    </div>
    <div class="platform-brand-copy">
      <strong style="font-size:1.15rem;">EnglishBridge</strong>
      <span style="font-size:0.8rem;">Educator & Admin Command</span>
    </div>
  </div>

  <section class="auth-card">
    <div class="mode-tab">
      <button class="mode-tab-btn active" id="tabLogin" onclick="switchTab('login')">Sign In</button>
      <button class="mode-tab-btn" id="tabRegister" onclick="switchTab('register')">Create Account</button>
    </div>

    <!-- LOGIN MODE -->
    <div id="loginForm">
      <div class="auth-header">
        <h2>Educator Studio</h2>
        <p class="auth-subtitle">Enter your admin credentials to manage classes and curriculum.</p>
      </div>

      <div class="form-group">
        <label class="form-label" for="loginUser">Username</label>
        <input id="loginUser" type="text" placeholder="e.g. admin" autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label" for="loginPass">Password</label>
        <input id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>

      <button type="button" class="demo-pill-btn" onclick="fillAdminDemo()">
        ⚡ Quick Fill Demo Admin
      </button>

      <div class="error-msg" id="loginError"></div>

      <button class="primary-action" style="margin-top: 14px; width: 100%; min-height: 48px; font-size: 1rem;" onclick="doLogin()">
        Access Command Studio →
      </button>
    </div>

    <!-- REGISTER MODE -->
    <div id="registerForm" style="display:none;">
      <div class="auth-header">
        <h2>Create Admin Account</h2>
        <p class="auth-subtitle">Set up a new teacher or coordinator profile.</p>
      </div>

      <div class="form-group">
        <label class="form-label" for="regUser">Username</label>
        <input id="regUser" type="text" placeholder="Choose a username" autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label" for="regPass">Password</label>
        <input id="regPass" type="password" placeholder="Min. 6 characters" autocomplete="new-password">
      </div>

      <div class="form-group">
        <label class="form-label" for="regPassConfirm">Confirm Password</label>
        <input id="regPassConfirm" type="password" placeholder="Repeat password" autocomplete="new-password">
      </div>

      <div class="error-msg" id="registerError"></div>
      <div class="success-msg" id="registerSuccess"></div>

      <button class="primary-action" style="margin-top: 14px; width: 100%; min-height: 48px; font-size: 1rem;" onclick="doRegister()">
        Create Account →
      </button>
    </div>
  </section>

  <button class="back-btn" onclick="window.location.href='index.html'">
    ← Back to Welcome
  </button>

</div>

<script src="Api.js"></script>
<script>
function fillAdminDemo() {
  document.getElementById("loginUser").value = "admin";
  document.getElementById("loginPass").value = "admin123";
}

function switchTab(mode) {
  const isLogin = mode === "login";
  document.getElementById("loginForm").style.display    = isLogin ? "" : "none";
  document.getElementById("registerForm").style.display = isLogin ? "none" : "";
  document.getElementById("tabLogin").classList.toggle("active", isLogin);
  document.getElementById("tabRegister").classList.toggle("active", !isLogin);
  clearErrors();
}

function clearErrors() {
  ["loginError","registerError","registerSuccess"].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.classList.remove("show"); el.textContent = ""; }
  });
}

function showError(id, msg)   { const el = document.getElementById(id); if (el) { el.textContent = msg; el.classList.add("show"); } }
function showSuccess(id, msg) { const el = document.getElementById(id); if (el) { el.textContent = msg; el.classList.add("show"); } }

async function doLogin() {
  const username = document.getElementById("loginUser").value.trim();
  const password = document.getElementById("loginPass").value;
  if (!username || !password) { showError("loginError", "Please enter your username and password."); return; }
  const btn = document.querySelector("#loginForm .primary-action");
  if (btn) { btn.textContent = "Authenticating…"; btn.disabled = true; }
  try {
    await Auth.login(username, password);
    window.location.href = "admin.html";
  } catch (err) {
    showError("loginError", err.message || "Incorrect username or password.");
    if (btn) { btn.textContent = "Access Command Studio →"; btn.disabled = false; }
  }
}

async function doRegister() {
  const username = document.getElementById("regUser").value.trim();
  const password = document.getElementById("regPass").value;
  const confirm  = document.getElementById("regPassConfirm").value;
  if (!username || !password) { showError("registerError", "Please fill in all fields."); return; }
  if (username.length < 3)    { showError("registerError", "Username must be at least 3 characters."); return; }
  if (password.length < 6)    { showError("registerError", "Password must be at least 6 characters."); return; }
  if (password !== confirm)   { showError("registerError", "Passwords do not match."); return; }
  const btn = document.querySelector("#registerForm .primary-action");
  if (btn) { btn.textContent = "Creating Account…"; btn.disabled = true; }
  try {
    await Auth.register(username, password);
    document.getElementById("regUser").value = "";
    document.getElementById("regPass").value = "";
    document.getElementById("regPassConfirm").value = "";
    showSuccess("registerSuccess", `✓ Account "${username}" created! You can now sign in.`);
    if (btn) { btn.textContent = "Create Account →"; btn.disabled = false; }
  } catch (err) {
    showError("registerError", err.message || "Could not create account.");
    if (btn) { btn.textContent = "Create Account →"; btn.disabled = false; }
  }
}

document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const loginVisible = document.getElementById("loginForm").style.display !== "none";
  if (loginVisible) doLogin(); else doRegister();
});
</script>
</body>
</html>
