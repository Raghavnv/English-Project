<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard | EnglishBridge</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="platform.css">
  <style>
    /* ── BASE LAYOUT ── */
    .dashboard-shell {
      width: min(calc(100% - 32px), 1000px);
      margin: 0 auto;
      padding: 24px 0 80px;
      display: grid;
      gap: 24px;
    }

    /* ── STUDENT WELCOME HERO ── */
    .student-hero {
      border-radius: 28px;
      padding: 38px 44px;
      background: linear-gradient(145deg, rgba(255,251,246,0.97), rgba(249,240,227,0.92));
      border: 1px solid rgba(255,255,255,0.7);
      box-shadow: var(--shadow);
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .student-hero::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(80,58,40,0.07);
      border-radius: 20px;
      pointer-events: none;
    }

    .hero-text h1 {
      font-family: "Newsreader", serif;
      font-size: clamp(2rem, 4vw, 2.8rem);
      line-height: 1.1;
      margin: 0 0 8px;
      color: var(--accent-deep);
    }

    .hero-text p {
      color: var(--muted);
      font-size: 1.05rem;
      margin: 0;
    }

    /* ── CLASS SECTIONS & LESSON GRID ── */
    .class-section {
      margin-bottom: 32px;
    }

    .class-section h2 {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--accent-deep);
      margin-bottom: 16px;
      padding-left: 8px;
      letter-spacing: 0.02em;
    }

    .lesson-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .lesson-card {
      border-radius: 20px;
      padding: 24px;
      background: linear-gradient(145deg, rgba(255,255,255,0.9), rgba(250,245,237,0.8));
      border: 1px solid rgba(80,58,40,0.1);
      box-shadow: var(--shadow-soft);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .lesson-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
    }

    .lesson-card-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text);
      margin: 0 0 8px;
      line-height: 1.3;
    }

    .lesson-card-desc {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.5;
      margin: 0 0 20px;
      flex: 1;
    }

    .lesson-status {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 12px;
      width: fit-content;
    }

    .status-completed { 
      background: rgba(111,124,74,0.15); 
      color: #3a5018; 
    }

    .status-progress { 
      background: rgba(188,93,45,0.12); 
      color: var(--accent-deep); 
    }

    .status-new { 
      background: rgba(80,58,40,0.08); 
      color: var(--muted); 
    }

    .lesson-action-btn {
      min-height: 44px;
      border-radius: 12px;
      border: none;
      background: var(--accent-deep);
      color: #fffaf2;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease;
      width: 100%;
    }

    .lesson-action-btn:hover {
      background: var(--text);
    }

    /* ── QUICK ACTION BUTTONS ON CARDS ── */
    .card-extra-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .extra-btn {
      min-height: 38px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .btn-relearn-card {
      background: rgba(56,189,248,0.1);
      border: 1px solid rgba(56,189,248,0.3);
      color: #0284c7;
    }

    .btn-relearn-card:hover { 
      background: rgba(56,189,248,0.2); 
    }

    .btn-flash-card {
      background: rgba(139,92,246,0.1);
      border: 1px solid rgba(139,92,246,0.3);
      color: #6d28d9;
    }

    .btn-flash-card:hover { 
      background: rgba(139,92,246,0.2); 
    }

    /* ── MODALS (Re-Learn & Flashcards) ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(20,15,10,0.6);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }

    .modal-overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    .modal-content {
      width: 100%;
      max-width: 800px;
      max-height: 90vh;
      border-radius: 28px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      transform: translateY(20px) scale(0.98);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }

    .modal-overlay.show .modal-content {
      transform: translateY(0) scale(1);
    }

    .modal-header {
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .modal-close {
      background: rgba(255,255,255,0.15);
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .modal-close:hover {
      background: rgba(255,255,255,0.3);
    }

    .modal-body {
      padding: 24px;
      overflow-y: auto;
      flex: 1;
    }

    /* Re-Learn Modal Theme */
    .relearn-modal {
      background: linear-gradient(135deg, #0f2027 0%, #1a3a4a 50%, #0f2027 100%);
      border: 1px solid rgba(56,189,248,0.3);
    }

    .relearn-modal .modal-header {
      border-bottom: 1px solid rgba(56,189,248,0.15);
    }

    .relearn-modal .modal-title {
      color: #e0f2fe;
      font-size: 1.2rem;
      font-weight: 800;
      margin: 0;
      display: flex;
      gap: 10px;
    }

    /* Flashcard Modal Theme */
    .flashcard-modal {
      background: linear-gradient(145deg, #f5f3ff, #ede9fe);
      border: 1px solid rgba(139, 92, 246, 0.4);
    }

    .flashcard-modal .modal-header {
      border-bottom: 1px solid rgba(139, 92, 246, 0.15);
    }

    .flashcard-modal .modal-title {
      color: #4c1d95;
      font-size: 1.2rem;
      font-weight: 800;
      margin: 0;
      display: flex;
      gap: 10px;
    }

    .flashcard-modal .modal-close {
      background: rgba(76, 29, 149, 0.1);
      color: #4c1d95;
    }

    /* Re-Learn Content Styles */
    .relearn-content { 
      color: #cbd5e1; 
      font-size: 1rem; 
      line-height: 1.8; 
    }

    .relearn-content .rl-section { 
      margin-bottom: 24px; 
    }

    .relearn-content .rl-header { 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      font-size: 0.85rem; 
      font-weight: 800; 
      letter-spacing: 0.08em; 
      text-transform: uppercase; 
      color: #7dd3fc; 
      margin-bottom: 12px; 
      padding-bottom: 8px; 
      border-bottom: 1px solid rgba(56,189,248,0.12); 
    }

    .relearn-content ul { 
      list-style: none; 
      padding: 0; 
      margin: 0; 
      display: grid; 
      gap: 10px; 
    }

    .relearn-content ul li { 
      display: flex; 
      gap: 10px; 
      align-items: flex-start; 
    }

    .relearn-content ul li::before { 
      content: "→"; 
      color: #38bdf8; 
      font-weight: 800; 
      flex-shrink: 0; 
      margin-top: 2px; 
    }

    .relearn-content .rl-example { 
      background: rgba(255,255,255,0.04); 
      border: 1px solid rgba(56,189,248,0.1); 
      border-radius: 12px; 
      padding: 12px 16px; 
      font-style: italic; 
      color: #a5f3fc; 
      margin-bottom: 10px; 
    }

    /* Flashcard Grid Styles */
    .ai-card-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); 
      gap: 20px; 
      perspective: 1000px; 
    }

    .ai-card-wrapper { 
      width: 100%; 
      height: 180px; 
      cursor: pointer; 
      perspective: 1000px; 
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) backwards; 
    }

    .ai-card-inner { 
      position: relative; 
      width: 100%; 
      height: 100%; 
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); 
      transform-style: preserve-3d; 
      border-radius: 18px; 
      box-shadow: 0 8px 20px rgba(46, 16, 101, 0.12); 
    }

    .ai-card-wrapper:hover .ai-card-inner { 
      box-shadow: 0 12px 28px rgba(46, 16, 101, 0.2); 
      transform: translateY(-3px); 
    }

    .ai-card-inner.is-flipped { 
      transform: rotateY(180deg); 
    }

    .ai-card-front, .ai-card-back { 
      position: absolute; 
      width: 100%; 
      height: 100%; 
      backface-visibility: hidden; 
      border-radius: 18px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      padding: 20px; 
      font-size: 1.25rem; 
      font-weight: 700; 
      text-align: center; 
    }

    .ai-card-front { 
      background: #ffffff; 
      border: 2px solid rgba(139, 92, 246, 0.3); 
      color: #4c1d95; 
    }

    .ai-card-back { 
      background: linear-gradient(135deg, #7c3aed, #5b21b6); 
      border: 2px solid rgba(109, 40, 217, 0.6); 
      color: #ffffff; 
      transform: rotateY(180deg); 
      font-size: 1.05rem; 
      line-height: 1.45; 
    }

    /* Loading Spinner Styles */
    .ai-loading-state { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      padding: 40px 0; 
      gap: 16px; 
      text-align: center; 
    }

    .spinner { 
      width: 36px; 
      height: 36px; 
      border: 3px solid rgba(255,255,255,0.2); 
      border-radius: 50%; 
      animation: spin 0.8s linear infinite; 
    }

    .spinner.purple { 
      border-color: rgba(139,92,246,0.2); 
      border-top-color: #7c3aed; 
    }

    .spinner.blue { 
      border-color: rgba(56,189,248,0.2); 
      border-top-color: #38bdf8; 
    }

    @keyframes spin { 
      to { transform: rotate(360deg); } 
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.8) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
  </style>
</head>
<body>

<div class="platform-shell">

  <header class="platform-header">
    <div style="display: flex; align-items: center; gap: 16px;">
      <div class="platform-brand" style="margin: 0;">
        <div class="platform-brand-mark" style="overflow:hidden;background:rgba(255,250,242,0.95);border:1px solid rgba(188,93,45,0.14);border-radius:14px;box-shadow:0 4px 12px rgba(124,53,26,0.12);padding:4px;">
          <img src="EnglishBridgeLogo.png" alt="EnglishBridge logo" style="width:100%;height:100%;object-fit:contain;display:block;">
        </div>
        <div class="platform-brand-copy">
          <strong>EnglishBridge</strong>
          <span id="headerStudentName">Student Dashboard</span>
        </div>
      </div>
      <div style="width: 1.5px; height: 32px; background: rgba(80,58,40,0.15); border-radius: 2px;"></div>
      <img src="sensesyslogo.png" alt="SenseSys Logo" style="height: 24px; object-fit: contain; margin-top: 2px;">
    </div>
    <div class="platform-header-actions">
      <button class="header-chip" onclick="doLogout()">Sign Out</button>
    </div>
  </header>

  <main class="dashboard-shell">
    
    <div class="student-hero">
      <div class="hero-text">
        <h1 id="welcomeTitle">Welcome back!</h1>
        <p>Ready to continue your English journey today?</p>
      </div>
    </div>

    <!-- ORIGINAL LESSONS VIEW CONTAINER -->
    <div id="lessonsContainer">
      <div style="padding: 40px; text-align: center; color: var(--muted);">Loading your lessons...</div>
    </div>

  </main>
</div>

<!-- MODAL: RE-LEARN -->
<div class="modal-overlay" id="modalRelearn" onclick="closeModals(event)">
  <div class="modal-content relearn-modal">
    <div class="modal-header">
      <h3 class="modal-title">📖 <span id="relearnModalTitle">Lesson Recap</span></h3>
      <button class="modal-close" onclick="closeModals()">✕</button>
    </div>
    <div class="modal-body">
      <div id="relearnContentArea"></div>
    </div>
  </div>
</div>

<!-- MODAL: FLASHCARDS -->
<div class="modal-overlay" id="modalFlashcards" onclick="closeModals(event)">
  <div class="modal-content flashcard-modal">
    <div class="modal-header">
      <h3 class="modal-title">✨ <span id="flashcardModalTitle">Smart Flashcards</span></h3>
      <button class="modal-close" onclick="closeModals()">✕</button>
    </div>
    <div class="modal-body">
      <div id="flashcardContentArea" class="ai-card-grid"></div>
    </div>
  </div>
</div>

<script src="Api.js"></script>
<script src="platform.js"></script>
</body>
</html>
